# SERVER (Lightsail): pull the published image; HOST bind-mounts so all state
# lives under ~/poshak and survives container/volume loss (backup = tar ~/poshak).
#   docker compose -f docker-compose.prod.yml pull && up -d
services:
  image-search:
    image: kent997/poshak:latest
    container_name: poshak
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8088:8088"
    env_file: .env
    environment:
      DATA_ROOT: /data
      CORPUS_DIR: /corpus/uploads
      RMBG_DIR: /corpus/rmbg
      REMBG_API_URL: ${REMBG_API_URL:-https://rembg.example.com}
    volumes:
      - ${POSHAK_HOME:-/home/ubuntu/poshak}/data:/data
      - ${POSHAK_HOME:-/home/ubuntu/poshak}/corpus:/corpus
      - models:/models
    mem_limit: 2g
    mem_reservation: 512m
volumes:
  models:
