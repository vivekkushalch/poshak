<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>How a search works in four plain steps: send a photo, shortlist similar pieces, check the fine details, get the exact match</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#a7a5c4" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="10" y="38" width="195" height="108" rx="12" fill="#1c1a2e" stroke="#3a3858" stroke-width="1.4"/><circle cx="34" cy="38" r="15" fill="#a7a5c4"/><text x="34" y="43" fill="#0b0f19" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="107.5" y="80" fill="#ecebf8" font-size="19" font-weight="700" text-anchor="middle">Send a photo</text><text x="107.5" y="104" fill="#a7a5c4" font-size="13" text-anchor="middle">Any photo of a garment,</text><text x="107.5" y="122" fill="#a7a5c4" font-size="13" text-anchor="middle">or a fabric swatch.</text><line x1="209" y1="92.0" x2="239" y2="92.0" stroke="#a7a5c4" stroke-width="1.6" marker-end="url(#a)"/><rect x="245" y="38" width="195" height="108" rx="12" fill="#16263d" stroke="#6da7ec" stroke-width="1.4"/><circle cx="269" cy="38" r="15" fill="#6da7ec"/><text x="269" y="43" fill="#0b0f19" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="342.5" y="80" fill="#6da7ec" font-size="19" font-weight="700" text-anchor="middle">Shortlist</text><text x="342.5" y="104" fill="#a7a5c4" font-size="13" text-anchor="middle">An AI model picks the 40</text><text x="342.5" y="122" fill="#a7a5c4" font-size="13" text-anchor="middle">most similar pieces. Fast.</text><line x1="444" y1="92.0" x2="474" y2="92.0" stroke="#a7a5c4" stroke-width="1.6" marker-end="url(#a)"/><rect x="480" y="38" width="195" height="108" rx="12" fill="#3d1e14" stroke="#ec8a68" stroke-width="1.4"/><circle cx="504" cy="38" r="15" fill="#ec8a68"/><text x="504" y="43" fill="#0b0f19" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="577.5" y="80" fill="#ec8a68" font-size="19" font-weight="700" text-anchor="middle">Check details</text><text x="577.5" y="104" fill="#a7a5c4" font-size="13" text-anchor="middle">Compares embroidery, borders</text><text x="577.5" y="122" fill="#a7a5c4" font-size="13" text-anchor="middle">and prints point by point.</text><line x1="679" y1="92.0" x2="709" y2="92.0" stroke="#a7a5c4" stroke-width="1.6" marker-end="url(#a)"/><rect x="715" y="38" width="195" height="108" rx="12" fill="#1c1a2e" stroke="#3a3858" stroke-width="1.4"/><circle cx="739" cy="38" r="15" fill="#a7a5c4"/><text x="739" y="43" fill="#0b0f19" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="812.5" y="80" fill="#ecebf8" font-size="19" font-weight="700" text-anchor="middle">Get the match</text><text x="812.5" y="104" fill="#a7a5c4" font-size="13" text-anchor="middle">The exact piece, ranked,</text><text x="812.5" y="122" fill="#a7a5c4" font-size="13" text-anchor="middle">with match counts shown.</text></svg>