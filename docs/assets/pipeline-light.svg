<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>Search pipeline: embed, recall 40 candidates by cosine, verify with SIFT, fuse two views per SKU</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5a78" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="10.5" y="52" width="124" height="64" rx="10" fill="#ffffff" stroke="#c9c7dc" stroke-width="1.2"/><text x="72.5" y="77" fill="#1d1b3a" font-size="15" font-weight="600" text-anchor="middle">Query</text><text x="72.5" y="98" fill="#5c5a78" font-size="12" text-anchor="middle">any photo</text><rect x="161.5" y="52" width="124" height="64" rx="10" fill="#ffffff" stroke="#c9c7dc" stroke-width="1.2"/><text x="223.5" y="77" fill="#1d1b3a" font-size="15" font-weight="600" text-anchor="middle">Embed</text><text x="223.5" y="98" fill="#5c5a78" font-size="12" text-anchor="middle">SigLIP, 768-d</text><line x1="137.5" y1="84.0" x2="157.5" y2="84.0" stroke="#5c5a78" stroke-width="1.4" marker-end="url(#a)"/><rect x="312.5" y="52" width="124" height="64" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.2"/><text x="374.5" y="77" fill="#2a78d6" font-size="15" font-weight="600" text-anchor="middle">Recall</text><text x="374.5" y="98" fill="#5c5a78" font-size="12" text-anchor="middle">cosine top 40</text><line x1="288.5" y1="84.0" x2="308.5" y2="84.0" stroke="#5c5a78" stroke-width="1.4" marker-end="url(#a)"/><text x="374.5" y="142" fill="#2a78d6" font-size="12" font-weight="600" text-anchor="middle">grows with catalog</text><text x="374.5" y="160" fill="#5c5a78" font-size="12" text-anchor="middle">one matrix product</text><rect x="463.5" y="52" width="124" height="64" rx="10" fill="#fbe9e2" stroke="#c2512e" stroke-width="1.2"/><text x="525.5" y="77" fill="#c2512e" font-