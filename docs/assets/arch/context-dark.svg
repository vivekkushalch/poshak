<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>poshak system context: who uses it and what it depends on</title><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a789a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><circle cx="150.0" cy="34" r="13" fill="#211e4a" stroke="#8f8af0" stroke-width="1.3"/><path d="M124.0 72 Q124.0 50 150.0 50 Q176.0 50 176.0 72 Z" fill="#211e4a" stroke="#8f8af0" stroke-width="1.3"/><text x="150.0" y="90" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Shopper</text><text x="150.0" y="108" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">photographs a garment</text><circle cx="500.0" cy="34" r="13" fill="#211e4a" stroke="#8f8af0" stroke-width="1.3"/><path d="M474.0 72 Q474.0 50 500.0 50 Q526.0 50 526.0 72 Z" fill="#211e4a" stroke="#8f8af0" stroke-width="1.3"/><text x="500.0" y="90" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Catalog staff</text><text x="500.0" y="108" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">adds and fixes photos</text><rect x="720" y="26" width="220" height="84" rx="10" fill="#16142e" stroke="#4a4870" stroke-width="1.3" stroke-dasharray="5 4"/><text x="830.0" y="47.5" fill="#a7a5c4" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle">PLANNED</text><text x="830.0" y="61.5" fill="#a7a5c4" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">AI agent</text><text x="830.0" y="80.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">asks via MCP</text><rect x="30" y="220" width="240" height="104" rx="10" fill="#16142e" stroke="#4a4870" stroke-width="1.3"/><text x="150.0" y="255.0" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Storefront</text><text x="150.0" y="274.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">any web or mobile app</text><text x="150.0" y="291.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">owns products, cart, users</text><rect x="390" y="200" width="290" height="144" rx="10" fill="#3b36a0" stroke="#3b36a0" stroke-width="1.3"/><text x="535.0" y="234.5" fill="#d7d4ff" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle">THIS SYSTEM</text><text x="535.0" y="248.5" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">poshak</text><text x="535.0" y="267.5" fill="#d7d4ff" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">visual search service</text><text x="535.0" y="284.5" fill="#d7d4ff" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">index · search · ingest jobs</text><text x="535.0" y="301.5" fill="#d7d4ff" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">REST + OpenAPI</text><rect x="40" y="470" width="260" height="96" rx="10" fill="#16142e" stroke="#4a4870" stroke-width="1.3"/><text x="170.0" y="501.0" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Object storage</text><text x="170.0" y="520.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">S3, MinIO or R2</text><text x="170.0" y="537.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">photos, cutouts, descriptors</text><rect x="370" y="470" width="300" height="96" rx="10" fi