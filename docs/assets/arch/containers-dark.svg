<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>poshak containers: processes and data stores inside one deployment</title><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a789a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="82" width="170" height="96" rx="10" fill="#16142e" stroke="#4a4870" stroke-width="1.3"/><text x="105.0" y="113.0" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Storefront</text><text x="105.0" y="132.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">or /ui, /admin</text><text x="105.0" y="149.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">in a browser</text><rect x="215" y="20" width="565" height="620" rx="14" fill="none" stroke="#e8b84a" stroke-width="1.4" stroke-dasharray="7 5"/><text x="231" y="38" fill="#e8b84a" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle">POSHAK DEPLOYMENT  ·  one container, one process</text><rect x="250" y="60" width="500" height="120" rx="10" fill="#3b36a0" stroke="#3b36a0" stroke-width="1.3"/><text x="500.0" y="94.5" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">HTTP API</text><text x="500.0" y="113.5" fill="#d7d4ff" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">FastAPI on uvicorn · routes call services</text><text x="500.0" y="130.5" fill="#d7d4ff" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">holds the live index snapshot in RAM</text><text x="500.0" y="147.5" fill="#d7d4ff" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">search runs in the threadpool, capped by a semaphore</text><rect x="250" y="220" width="230" height="110" rx="10" fill="#211e4a" stroke="#8f8af0" stroke-width="1.3"/><text x="365.0" y="249.5" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Ingest worker</text><text x="365.0" y="268.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">background thread</text><text x="365.0" y="285.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">drains the job queue</text><text x="365.0" y="302.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">reloads index in batches</text><rect x="520" y="220" width="230" height="110" rx="10" fill="#211e4a" stroke="#8f8af0" stroke-width="1.3"/><text x="635.0" y="249.5" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Verify pool</text><text x="635.0" y="268.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">SIFT_WORKERS threads</text><text x="635.0" y="285.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">Lowe-ratio matching</text><text x="635.0" y="302.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">40 candidates per pass</text><rect x="250" y="370" width="500" height="76" rx="10" fill="#33280f" stroke="#e8b84a" stroke-width="1.3"/><text x="500.0" y="399.5" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Model runtime</text><text x="500.0" y="418.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">SigLIP vision tower (torch, CPU)  ·  U2Net (ONNX Runtime)</text><path d="M250 509 A80.0 9 0 0 1 410 509 V611 A80.0 9 0 0 1 250 611 Z" fill="#1b1938" stroke="#8f8af0" stroke-width="1.3"/><path d="M250 509 A80.0 9 0 0 0 410 509" fill="none" stroke="#8f8af0" stroke-width="1.3"/><text x="330.0" y="538.5" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">SQLite</text><text x="330.0" y="557.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">WAL mode</text><text x="330.0" y="574.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">images · jobs</text><text x="330.0" y="591.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">categories</text><path d="M430 509 A80.0 9 0 0 1 590 509 V611 A80.0 9 0 0 1 430 611 Z" fill="#1b1938" stroke="#8f8af0" stroke-width="1.3"/><path d="M430 509 A80.0 9 0 0 0 590 509" fill="none" stroke="#8f8af0" stroke-width="1.3"/><text x="510.0" y="538.5" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Blob store</text><text x="510.0" y="557.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">originals</text><text x="510.0" y="574.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">cutouts</text><text x="510.0" y="591.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">descriptors</text><path d="M610 509 A70.0 9 0 0 1 750 509 V611 A70.0 9 0 0 1 610 611 Z" fill="#1b1938" stroke="#8f8af0" stroke-width="1.3"/><path d="M610 509 A70.0 9 0 0 0 750 509" fill="none" stroke="#8f8af0" stroke-width="1.3"/><text x="680.0" y="547.0" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">/models</text><text x="680.0" y="566.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">baked weights</text><text x="680.0" y="583.0" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">U2Net cache</text><rect x="810" y="220" width="150" height="110" rx="10" fill="#16142e" stroke="#4a4870" stroke-width="1.3"/><text x="885.0" y="249.5" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Background API</text><text x="885.0" y="268.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">optional</text><text x="885.0" y="285.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">REMBG_API_URL</text><text x="885.0" y="302.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">index time only</text><rect x="810" y="500" width="150" height="120" rx="10" fill="#16142e" stroke="#4a4870" stroke-width="1.3"/><text x="885.0" y="534.5" fill="#f4f1ff" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">Object storage</text><text x="885.0" y="553.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">replaces local</text><text x="885.0" y="570.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">blobs when</text><text x="885.0" y="587.5" fill="#a7a5c4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">STORAGE_BACKEND=s3</text><path d="M190 130 L246 130" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="218" y="116" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle">HTTPS</text><path d="M365 182 L365 216" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="375" y="199" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle">submit job</text><path d="M635 182 L635 216" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="645" y="199" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle">verify</text><path d="M500 182 L500 366" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="510" y="352" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle">embed query</text><path d="M365 332 L365 366" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="375" y="349" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle">embed · cut out</text><path d="M680 448 L680 496" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="690" y="472" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle">load</text><path d="M250 150 L232 150 L232 476 L510 476 L510 496" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><path d="M250 275 L232 275" fill="none" stroke="#7a789a" stroke-width="1.4" /><path d="M330 476 L330 496" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="330" y="462" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle">read · write state</text><path d="M752 408 L790 408 L790 275 L806 275" fill="none" stroke="#7a789a" stroke-width="1.4" marker-end="url(#h)"/><text x="796" y="340" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle">or remote</text><path d="M510 622 L510 632 L885 632 L885 624" fill="none" stroke="#7a789a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#h)"/><text x="700" y="650" fill="#a7a5c4" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle">s3 backend</text></svg>