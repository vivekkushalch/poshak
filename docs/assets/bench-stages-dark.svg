<svg xmlns="http://www.w3.org/2000/svg" width="760" height="284" viewBox="0 0 760 284" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>Median latency of each stage of a cloth search</title><rect width="760" height="284" rx="8" fill="#1a1a19"/><text x="24" y="28" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle">Where the time goes in one cloth search</text><text x="24" y="50" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">Median per stage, 1600x1200 photo, Intel(R) Core(TM) i5-7200U CPU @ 2.50GHz</text><text x="250" y="80.0" fill="#ffffff" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle">Decode + resize to 768 px</text><path d="M270,70 H272.023498694517 Q274.04699738903395,70 274.04699738903395,72.02349869451697 V87.97650130548303 Q274.04699738903395,90 272.023498694517,90 H270 Z" fill="#3987e5"/><text x="282.04699738903395" y="80.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">28 ms</text><text x="250" y="114.0" fill="#ffffff" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle">Background removal (U2Net)</text><path d="M270,104 H666.0 Q670.0,104 670.0,108 V120 Q670.0,124 666.0,124 H270 Z" fill="#3987e5"/><text x="678.0" y="114.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">2.76 s</text><text x="250" y="148.0" fill="#ffffff" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle">SigLIP embed, 2 views</text><path d="M270,138 H382.50710762982305 Q386.50710762982305,138 386.50710762982305,142 V154 Q386.50710762982305,158 382.50710762982305,158 H270 Z" fill="#3987e5"/><text x="394.50710762982305" y="148.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">803 ms</text><text x="250" y="182.0" fill="#ffffff" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle">SIFT keypoints, 2 views</text><path d="M270,172 H301.2190310414853 Q305.2190310414853,172 305.2190310414853,176 V188 Q305.2190310414853,192 301.2190310414853,192 H270 Z" fill="#3987e5"/><text x="313.2190310414853" y="182.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">243 ms</text><text x="250" y="216.0" fill="#ffffff" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle">Recall top 40 of 100k, 2 views</text><path d="M270,206 H273.2492022048158 Q276.4984044096316,206 276.4984044096316,209.2492022048158 V222.7507977951842 Q276.4984044096316,226 273.2492022048158,226 H270 Z" fill="#3987e5"/><text x="284.4984044096316" y="216.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">45 ms</text><text x="250" y="250.0" fill="#ffffff" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle">SIFT verify 2 x 40, 4 threads</text><path d="M270,240 H385.4952132288947 Q389.4952132288947,240 389.4952132288947,244 V256 Q389.4952132288947,260 385.4952132288947,260 H270 Z" fill="#3987e5"/><text x="397.4952132288947" y="250.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">824 ms</text></svg>