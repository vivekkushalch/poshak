<svg xmlns="http://www.w3.org/2000/svg" width="760" height="326" viewBox="0 0 760 326" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>Recall latency against catalog size, with fixed verify cost</title><rect width="760" height="326" rx="8" fill="#1a1a19"/><text x="24" y="28" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle">Recall grows with the catalog, verification does not</text><text x="24" y="50" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">One pass, median, Intel(R) Core(TM) i5-7200U CPU @ 2.50GHz</text><line x1="70" x2="590" y1="270.0" y2="270.0" stroke="#3a3a37"/><text x="60" y="270.0" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">0</text><line x1="70" x2="590" y1="199.91122792573123" y2="199.91122792573123" stroke="#3a3a37"/><text x="60" y="199.91122792573123" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">200 ms</text><line x1="70" x2="590" y1="129.82245585146245" y2="129.82245585146245" stroke="#3a3a37"/><text x="60" y="129.82245585146245" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle">400 ms</text><text x="70.0" y="288" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">1k</text><text x="243.33333333333331" y="288" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">10k</text><text x="416.66666666666663" y="288" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">100k</text><text x="590.0" y="288" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">1M</text><text x="330.0" y="308" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">photos in the index (log scale)</text><line x1="70" x2="590" y1="125.65217391304347" y2="125.65217391304347" stroke="#d95926" stroke-width="2" stroke-dasharray="6 4"/><text x="600" y="122.61095453729797" fill="#ffffff" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">verify 40: 412 ms</text><polyline points="70.0,269.92991122792574 243.33333333333331,269.2991122792573 416.66666666666663,262.1500575276819 590.0,135.56973516155247" fill="none" stroke="#3987e5" stroke-width="2"/><circle cx="70.0" cy="269.92991122792574" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="243.33333333333331" cy="269.2991122792573" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="416.66666666666663" cy="262.1500575276819" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="590.0" cy="135.56973516155247" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="600" y="138.61095453729797" fill="#ffffff" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">recall: 384 ms</text><line x1="70" x2="92" y1="78" y2="78" stroke="#3987e5" stroke-width="2" stroke-dasharray=""/><text x="100" y="78" fill="#ffffff" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">Recall (cosine over all photos)</text><line x1="320" x2="342" y1="78" y2="78" stroke="#d95926" stroke-width="2" stroke-dasharray="6 4"/><text x="350" y="78" fill="#ffffff" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">Verify (SIFT on 40 candidates)</text></svg>