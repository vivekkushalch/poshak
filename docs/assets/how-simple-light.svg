<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title>How a search works in four plain steps: send a photo, shortlist similar pieces, check the fine details, get the exact match</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5c5a78" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect x="10" y="38" width="195" height="108" rx="12" fill="#ffffff" stroke="#c9c7dc" stroke-width="1.4"/><circle cx="34" cy="38" r="15" fill="#5c5a78"/><text x="34" y="43" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="107.5" y="80" fill="#1d1b3a" font-size="19" font-weight="700" text-anchor="middle">Send a photo</text><text x="107.5" y="104" fill="#5c5a78" font-size="13" text-anchor="middle">Any photo of a garment,</text><text x="107.5" y="122" fill="#5c5a78" font-size="13" text-anchor="middle">or a fabric swatch.</text><line x1="209" y1="92.0" x2="239" y2="92.0" stroke="#5c5a78" stroke-width="1.6" marker-end="url(#a)"/><rect x="245" y="38" width="195" height="108" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.4"/><circle cx="269" cy="38" r="15" fill="#2a78d6"/><text x="269" y="43" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="342.5" y="80" fill="#2a78d6" font-size="19" font-weight="700" text-anchor="middle">Shortlist</text><text x="342.5" y="104" fill="#5c5a78" font-size="13" text-anchor="middle">An AI model picks the 40</text><text x="342.5" y="122" fill="#5c5a78" font-size="13" text-anchor="middle">most similar pieces. Fast.</text><line x1="444" y1="92.0" x2="474" y2="92.0" stroke="#5c5a78" stroke-width="1.6" marker-end="url(#a)"/><rect x="480" y="38" width="195" height="108" rx="12" fill="#fbe9e2" stroke="#c2512e" stroke-width="1.4"/><circle cx="504" cy="38" r="15" fill="#c2512e"/><text x="504" y="43" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="577.5" y="80" fill="#c2512e" font-size="19" font-weight="700" text-anchor="middle">Check details</text><text x="577.5" y="104" fill="#5c5a78" font-size="13" text-anchor="middle">Compares embroidery, borders</text><text x="577.5" y="122" fill="#5c5a78" font-size="13" text-anchor="middle">and prints point by point.</text><line x1="679" y1="92.0" x2="709" y2="92.0" stroke="#5c5a78" stroke-width="1.6" marker-end="url(#a)"/><rect x="715" y="38" width="195" height="108" rx="12" fill="#ffffff" stroke="#c9c7dc" stroke-width="1.4"/><circle cx="739" cy="38" r="15" fill="#5c5a78"/><text x="739" y="43" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="812.5" y="80" fill="#1d1b3a" font-size="19" font-weight="700" text-anchor="middle">Get the match</text><text x="812.5" y="104" fill="#5c5a78" font-size="13" text-anchor="middle">The exact piece, ranked,</text><text x="812.5" y="122" fill="#5c5a78" font-size="13" text-anchor="middle">with match counts shown.</text></svg>