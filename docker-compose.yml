# DEV: build locally, live-edit source, local data dirs.
#   docker compose up -d --build
#   curl http://localhost:8088/health
services:
  image-search:
    build: .
    image: poshak:dev
    container_name: poshak-dev
    ports:
      - "8088:8088"
    environment:
      DISABLE_AUTH: "1"
      DATA_ROOT: /data
      CORPUS_DIR: /corpus/uploads
      RMBG_DIR: /corpus/rmbg
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./service:/app/service          # live edit
      - ./scripts:/app/scripts
      - ./.localdata:/data              # sqlite + descriptors + ledger
      - ./.localcorpus:/corpus          # uploads + rmbg
      - models:/models
volumes:
  models:
