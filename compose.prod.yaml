# Single-node production (e.g. a 2 GB VM). All state lives under POSHAK_HOME on
# the host and survives container loss; back up with: tar czf poshak.tgz ~/poshak
#   docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d
services:
  poshak:
    image: ghcr.io/vivekkushalch/poshak:latest  # published by the release workflow on a v* tag
    container_name: poshak
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file: .env
    environment:
      DATA_ROOT: /data
      CORPUS_DIR: /corpus/uploads
      RMBG_DIR: /corpus/rmbg
    volumes:
      - ${POSHAK_HOME:-/home/ubuntu/poshak}/data:/data
      - ${POSHAK_HOME:-/home/ubuntu/poshak}/corpus:/corpus
      - models:/models
    mem_limit: 2g
    mem_reservation: 512m
volumes:
  models:
