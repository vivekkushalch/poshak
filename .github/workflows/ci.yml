name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these same checks before it publishes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: Admin UI modules parse
        run: |
          for f in src/poshak/static/common.js src/poshak/static/ui.js src/poshak/static/admin/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "syntax error in $f"; exit 1; }
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -m "not slow"
